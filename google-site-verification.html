<!DOCTYPE html>
<html><head>
  <meta charset="UTF-8">
  <!--
    GOOGLE SEARCH CONSOLE VERIFICATION
    ════════════════════════════════════
    How to use:
    1. Go to https://search.google.com/search-console
    2. Add property: https://taskroom.in
    3. Choose "HTML file" verification method
    4. Google gives you a filename like: google1234abcd5678ef90.html
    5. RENAME this file to that exact filename
    6. Upload to your root directory
    7. Click "Verify" in Search Console

    Alternatively, paste the meta tag version directly into the
    <head> of your index.html (already has a placeholder below).
  -->
  <title>Google Site Verification — TaskRoom</title>
</head><body>
  <!-- Replace XXXXXXXXXXXXXXXX with your actual verification token -->
  google-site-verification: googleXXXXXXXXXXXXXXXX.html
</body></html>
